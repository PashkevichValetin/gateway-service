spring:
  redis:
    host: redis-cache
    port: 6379
  cloud:
    gateway:
      routes:
        - id: monitor-route
          uri: http://monitoring-service:8080
          predicates:
            - Path=/monitor/**
        - id: data-route
          uri: http://data-unifier-service:8080
          predicates:
            - Path=/data/**

management:
  endpoints:
    web:
      exposure:
        include: "health,gateway,info,metrics"
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

